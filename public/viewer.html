<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Guardian Cam — Panel de Vigilancia</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg:    #07070d;
      --panel: #0f0f18;
      --border:#1e1e2e;
      --green: #00ff88;
      --blue:  #0088ff;
      --red:   #ff4444;
      --warn:  #ffaa00;
    }
    body {
      font-family: 'Segoe UI', monospace, sans-serif;
      background: var(--bg);
      color: #ccc;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    /* ── HEADER ── */
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.1em; flex: 1; color: #eee; }
    .badge-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #1a1a2a;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: .78em;
      color: #777;
    }
    .badge .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #333;
    }
    .badge.online .dot { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
    .badge.offline .dot { background: var(--red); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── MAIN ── */
    main {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 0;
      height: calc(100vh - 118px);
    }
    @media(max-width:768px) {
      main { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }

    /* ── FEED ── */
    .feed-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      background: #040408;
    }
    .feed-container {
      position: relative;
      width: 100%;
      max-width: 860px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--border);
      background: #000;
      aspect-ratio: 4/3;
    }
    #feedImg {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .feed-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: rgba(0,0,0,.8);
      transition: opacity .3s;
    }
    .feed-overlay.hidden { opacity: 0; pointer-events: none; }
    .feed-overlay .icon { font-size: 3em; }
    .feed-overlay p { color: #666; font-size: .9em; }

    /* REC indicator */
    .rec-badge {
      position: absolute;
      top: 14px; left: 14px;
      background: rgba(255,0,0,.85);
      color: #fff;
      font-size: .75em;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      display: none;
      align-items: center;
      gap: 5px;
      letter-spacing: 1px;
    }
    .rec-badge.show { display: flex; }
    .rec-dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: pulse 1s infinite; }

    /* timestamp overlay */
    .ts-overlay {
      position: absolute;
      bottom: 10px; right: 12px;
      background: rgba(0,0,0,.6);
      font-family: monospace;
      font-size: .75em;
      color: #aaa;
      padding: 3px 8px;
      border-radius: 6px;
    }

    /* ── CONTROLES BAJO EL FEED ── */
    .feed-controls {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      font-size: .88em;
      font-weight: 600;
      cursor: pointer;
      transition: transform .1s, opacity .2s;
    }
    .btn:active { transform: scale(.96); }
    .btn:disabled { opacity: .35; cursor: default; }
    .btn-flip { background: #1e1e2e; color: #aaa; border: 1px solid #333; }
    .btn-stop { background: var(--red); color: #fff; }
    .btn-snap { background: linear-gradient(135deg,#0088ff,#0055cc); color:#fff; }
    .btn-fullscreen { background: #1e1e2e; color: #aaa; border: 1px solid #333; }

    /* ── SIDEBAR ── */
    .sidebar {
      border-left: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-section {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-section h2 { font-size: .75em; text-transform: uppercase; color: #555; letter-spacing: 1px; margin-bottom: 12px; }

    .info-row { margin-bottom: 10px; }
    .info-row label { display: block; font-size: .7em; color: #555; text-transform: uppercase; margin-bottom: 2px; }
    .info-row .val { font-family: monospace; color: var(--green); font-size: .9em; word-break: break-all; }
    .info-row .val.red { color: var(--red); }
    .info-row .val.blue { color: var(--blue); }

    /* Log de eventos */
    .event-log {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .log-entry {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
      font-size: .75em;
      line-height: 1.4;
    }
    .log-entry .time { color: #444; flex-shrink: 0; }
    .log-entry .msg  { color: #777; }
    .log-entry.ok  .msg { color: var(--green); }
    .log-entry.err .msg { color: var(--red); }
    .log-entry.warn .msg { color: var(--warn); }

    /* Galería de snapshots */
    .snap-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 4px;
      padding: 10px;
      max-height: 180px;
      overflow-y: auto;
    }
    .snap-thumb {
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 4/3;
      cursor: pointer;
      border: 1px solid transparent;
      transition: border-color .2s;
    }
    .snap-thumb:hover { border-color: var(--blue); }
    .snap-thumb img { width:100%; height:100%; object-fit:cover; display:block; }

    /* ── FOOTER ── */
    footer {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 8px 20px;
      display: flex;
      justify-content: space-between;
      font-size: .72em;
      color: #444;
    }

    /* Modal snapshot */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.9);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }
    .modal.show { display: flex; }
    .modal img { max-width: 90vw; max-height: 80vh; border-radius: 10px; }
    .modal-close { background: #333; color: #aaa; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; }

    /* Alerta de movimiento / desconexión */
    .alert-bar {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 90;
      background: var(--red);
      color: #fff;
      text-align: center;
      padding: 10px;
      font-weight: 600;
      animation: slideDown .3s ease;
    }
    .alert-bar.show { display: block; }
    @keyframes slideDown { from{transform:translateY(-100%)} to{transform:translateY(0)} }
  </style>
</head>
<body>

<!-- Alerta de desconexión -->
<div class="alert-bar" id="alertBar">⚠️ ¡CÁMARA DESCONECTADA!</div>

<header>
  <h1>🔐 Guardian Cam — Panel de Vigilancia</h1>
  <div class="badge-group">
    <div class="badge offline" id="camBadge"><div class="dot"></div><span id="camStatus">Sin cámara</span></div>
    <div class="badge" id="fpsBadge"><span id="fpsVal">0</span> fps</div>
    <div class="badge" id="tunnelBadge" style="display:none">🌐 <span id="tunnelShort">—</span></div>
    <a href="/" class="badge" style="text-decoration:none;">🏠 Inicio</a>
  </div>
</header>

<main>

  <!-- FEED PRINCIPAL -->
  <div class="feed-area">
    <div class="feed-container">
      <img id="feedImg" src="" alt=""/>
      <div class="rec-badge" id="recBadge"><div class="rec-dot"></div> EN VIVO</div>
      <div class="ts-overlay" id="tsOverlay">—</div>

      <!-- Overlay cuando no hay señal -->
      <div class="feed-overlay" id="feedOverlay">
        <div class="icon">📷</div>
        <p>Esperando conexión de cámara...</p>
        <p style="font-size:.75em;color:#444;">Abre <b>/camera</b> en tu celular</p>
      </div>
    </div>

    <div class="feed-controls">
      <button class="btn btn-flip" onclick="sendCmd('flip')">🔄 Cambiar cámara</button>
      <button class="btn btn-stop" onclick="sendCmd('stop')">⏹ Detener remoto</button>
      <button class="btn btn-snap" onclick="takeSnapshot()">📸 Captura</button>
      <button class="btn btn-fullscreen" onclick="toggleFullscreen()">⛶ Pantalla completa</button>
    </div>
  </div>

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <!-- Info cámara -->
    <div class="sidebar-section">
      <h2>📡 Información del dispositivo</h2>
      <div class="info-row">
        <label>IP del celular</label>
        <div class="val" id="camIP">—</div>
      </div>
      <div class="info-row">
        <label>Estado</label>
        <div class="val" id="camState">Sin conexión</div>
      </div>
      <div class="info-row">
        <label>Conectado desde</label>
        <div class="val blue" id="connTime">—</div>
      </div>
      <div class="info-row">
        <label>Último frame</label>
        <div class="val blue" id="lastFrame">—</div>
      </div>
      <div class="info-row">
        <label>Frames recibidos</label>
        <div class="val" id="frameCount">0</div>
      </div>
      <div class="info-row">
        <label>Dispositivo</label>
        <div class="val blue" id="deviceInfo" style="font-size:.7em;">—</div>
      </div>
    </div>

    <!-- Capturas -->
    <div class="sidebar-section" style="padding-bottom:6px;">
      <h2>📸 Capturas recientes</h2>
    </div>
    <div class="snap-grid" id="snapGrid"></div>

    <!-- Log de eventos -->
    <div class="sidebar-section" style="border-bottom:none;">
      <h2>📋 Eventos</h2>
    </div>
    <div class="event-log" id="eventLog"></div>

  </aside>
</main>

<footer>
  <span>Guardian Cam v1.0 | Sistema activo</span>
  <span id="footerTime">—</span>
</footer>

<!-- Modal de preview de snapshot -->
<div class="modal" id="snapModal" onclick="this.classList.remove('show')">
  <img id="snapModalImg" src="" alt="Captura"/>
  <button class="modal-close">✕ Cerrar</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  // ── Estado ──────────────────────────────────────────────────────────────────
  let frames = 0, lastFrameTime = 0;
  let fpsCounter = 0, fpsTimer = null;
  let snapshots = [];
  const MAX_SNAPS = 9;

  // ── Reloj ───────────────────────────────────────────────────────────────────
  setInterval(() => {
    document.getElementById('footerTime').textContent = new Date().toLocaleString();
  }, 1000);

  // ── Log ─────────────────────────────────────────────────────────────────────
  function addLog(msg, type = '') {
    const div = document.getElementById('eventLog');
    const now = new Date().toLocaleTimeString();
    div.innerHTML = `<div class="log-entry ${type}"><span class="time">${now}</span><span class="msg">${msg}</span></div>` + div.innerHTML;
    // Limitar a 60 entradas
    const entries = div.querySelectorAll('.log-entry');
    if (entries.length > 60) entries[entries.length-1].remove();
  }

  // ── Socket.IO ───────────────────────────────────────────────────────────────
  const socket = io();

  socket.on('connect', () => {
    addLog('Conectado al servidor', 'ok');
    socket.emit('register-viewer');

    // Obtener URL del tunel
    fetch('/api/tunnel').then(r=>r.json()).then(d=>{
      if (d.url) {
        document.getElementById('tunnelBadge').style.display = 'inline-flex';
        document.getElementById('tunnelShort').textContent = d.url.replace('https://','');
        addLog('Tunel activo: ' + d.url, 'ok');
      }
    }).catch(()=>{});
  });

  socket.on('disconnect', () => addLog('Desconectado del servidor', 'err'));

  // ── Estado de cámara ─────────────────────────────────────────────────────
  socket.on('camera-status', (data) => {
    const camBadge = document.getElementById('camBadge');
    const overlay  = document.getElementById('feedOverlay');
    const recBadge = document.getElementById('recBadge');
    const alertBar = document.getElementById('alertBar');

    if (data.online) {
      camBadge.className = 'badge online';
      document.getElementById('camStatus').textContent = 'EN LÍNEA';
      document.getElementById('camIP').textContent = data.ip || '—';
      document.getElementById('camState').textContent = '🟢 Transmitiendo';
      document.getElementById('connTime').textContent = new Date().toLocaleTimeString();
      if (data.deviceInfo) document.getElementById('deviceInfo').textContent = data.deviceInfo;
      overlay.classList.add('hidden');
      recBadge.classList.add('show');
      alertBar.classList.remove('show');
      addLog(`Cámara conectada | IP: ${data.ip || '—'}`, 'ok');

      // Iniciar contador de FPS
      startFPS();
    } else {
      camBadge.className = 'badge offline';
      document.getElementById('camStatus').textContent = 'DESCONECTADA';
      document.getElementById('camState').innerHTML = '<span class="red">🔴 Sin señal</span>';
      overlay.classList.remove('hidden');
      recBadge.classList.remove('show');
      alertBar.classList.add('show');
      stopFPS();
      addLog('Cámara desconectada ⚠️', 'err');

      // Quitar alerta después de 6s
      setTimeout(() => alertBar.classList.remove('show'), 6000);
    }
  });

  // ── Recibir frames ────────────────────────────────────────────────────────
  socket.on('video-frame', (frameData) => {
    const img = document.getElementById('feedImg');
    img.src = frameData;
    frames++;
    fpsCounter++;
    lastFrameTime = Date.now();
    document.getElementById('lastFrame').textContent = new Date().toLocaleTimeString();
    document.getElementById('frameCount').textContent = frames;
    document.getElementById('tsOverlay').textContent = new Date().toLocaleTimeString();
  });

  // ── Heartbeat ─────────────────────────────────────────────────────────────
  socket.on('camera-heartbeat', (data) => {
    document.getElementById('lastFrame').textContent = new Date().toLocaleTimeString();
  });

  // ── FPS counter ──────────────────────────────────────────────────────────
  function startFPS() {
    stopFPS();
    fpsTimer = setInterval(() => {
      document.getElementById('fpsVal').textContent = fpsCounter;
      fpsCounter = 0;
    }, 1000);
  }
  function stopFPS() {
    if (fpsTimer) { clearInterval(fpsTimer); fpsTimer = null; }
    document.getElementById('fpsVal').textContent = '0';
  }

  // ── Enviar comandos a la cámara ───────────────────────────────────────────
  function sendCmd(action) {
    socket.emit('viewer-command', { action });
    addLog(`Comando enviado: ${action}`, 'warn');
  }

  // ── Snapshot ──────────────────────────────────────────────────────────────
  function takeSnapshot() {
    const img = document.getElementById('feedImg');
    if (!img.src || img.src === window.location.href) {
      addLog('No hay imagen para capturar', 'err');
      return;
    }
    const src = img.src;
    snapshots.unshift(src);
    if (snapshots.length > MAX_SNAPS) snapshots.pop();
    renderSnaps();
    addLog('Captura guardada 📸', 'ok');

    // Descarga automática
    const a = document.createElement('a');
    a.href = src;
    a.download = `guardcam_${Date.now()}.jpg`;
    a.click();
  }

  function renderSnaps() {
    const grid = document.getElementById('snapGrid');
    grid.innerHTML = snapshots.map((s,i) =>
      `<div class="snap-thumb" onclick="openSnap(${i})">
         <img src="${s}" alt="Captura ${i+1}"/>
       </div>`
    ).join('');
  }

  function openSnap(i) {
    document.getElementById('snapModalImg').src = snapshots[i];
    document.getElementById('snapModal').classList.add('show');
  }

  // ── Pantalla completa ─────────────────────────────────────────────────────
  function toggleFullscreen() {
    const fc = document.querySelector('.feed-container');
    if (!document.fullscreenElement) fc.requestFullscreen();
    else document.exitFullscreen();
  }
</script>
</body>
</html>
